basePath: /
definitions:
  domain.AdaptivePlanRequest:
    properties:
      course_id:
        description: CourseID identifies the course within which the adaptive plan
          is scoped.
        example: cs101
        type: string
      failed_topics:
        description: |-
          FailedTopics is a non-empty list of knowledge-graph node names
          representing concepts the student has not yet mastered.
        example:
        - Polymorphism
        - Recursion
        items:
          type: string
        type: array
      student_id:
        description: StudentID is the platform-level identifier for the learner.
        example: student-42
        type: string
      telemetry:
        $ref: '#/definitions/domain.Telemetry'
        description: |-
          Telemetry carries optional client-side diagnostic metadata.
          When nil, telemetry is omitted from the serialized payload.
      vark_profile:
        description: |-
          VARKProfile specifies the student's dominant learning modality.
          Accepted values: "visual", "auditory", "read_write", "kinesthetic".
        example: visual
        type: string
    type: object
  domain.CognitiveGraphResponse:
    properties:
      edges:
        description: Edges contains directed relationships between nodes in the subgraph.
        items:
          $ref: '#/definitions/domain.VisualEdge'
        type: array
      nodes:
        description: |-
          Nodes contains the filtered concept nodes, each annotated
          with the student's cognitive state.
        items:
          $ref: '#/definitions/domain.VisualNode'
        type: array
    type: object
  domain.ErrorResponse:
    properties:
      details:
        description: |-
          Details provides a human-readable explanation of the error cause.
          Omitted when empty.
        example: failed_topics must contain at least one topic
        type: string
      error:
        description: |-
          Error is a machine-readable error code (e.g., "validation_error",
          "rate_limit_exceeded", "service_unavailable").
        example: validation_error
        type: string
    type: object
  domain.HealthResponse:
    properties:
      status:
        description: Status is always "ok" when the service is running.
        example: ok
        type: string
    type: object
  domain.PipelineMeta:
    properties:
      items_after_validation:
        description: |-
          ItemsValidated is the count of study items remaining after the
          hallucination-guard stage drops items whose topics are absent from
          the knowledge graph.
        example: 5
        type: integer
      items_generated:
        description: |-
          ItemsGenerated is the total number of study items returned across
          all per-topic LLM calls before deduplication.
        example: 6
        type: integer
      llm_latency_ms:
        description: |-
          LLMLatencyMs is the wall-clock time (milliseconds) spent waiting
          for all parallel LLM calls to complete.
        example: 3240.5
        type: number
      subgraph_tuples:
        description: |-
          SubgraphTuples is the number of knowledge-graph triples extracted
          by the BFS subgraph traversal for the given failed topics.
        example: 12
        type: integer
      topics_processed:
        description: |-
          TopicsProcessed is the count of failed topics that were individually
          sent to the LLM via the parallel fan-out stage.
        example: 2
        type: integer
      total_latency_ms:
        description: |-
          TotalLatencyMs is the end-to-end pipeline duration (milliseconds)
          from request receipt to response serialization.
        example: 3312.8
        type: number
    type: object
  domain.PlanItem:
    properties:
      explanation:
        description: |-
          Explanation is a concise rationale generated by the LLM describing
          why this topic is relevant to the student's failed assessment.
        example: Polymorphism allows objects to be treated as instances of their parent
          class.
        type: string
      prerequisite_chain:
        description: |-
          PrerequisiteChain lists the ordered prerequisite path leading to this
          topic, extracted from the knowledge graph via topological sort.
        example:
        - Variables
        - Objects
        - Classes
        - Inheritance
        items:
          type: string
        type: array
      priority:
        description: |-
          Priority determines the recommended study order. 1 = highest priority
          (study first). Prerequisites always receive lower numbers than the
          topics that depend on them.
        example: 1
        type: integer
      resources:
        description: |-
          Resources contains 2-3 learning resources whose type strictly matches
          the student's VARK profile.
        items:
          $ref: '#/definitions/domain.Resource'
        type: array
      topic:
        description: Topic is the knowledge-graph node name this item targets.
        example: Polymorphism
        type: string
    type: object
  domain.PlanResponse:
    properties:
      _meta:
        $ref: '#/definitions/domain.PipelineMeta'
        description: |-
          Meta exposes internal pipeline metrics for observability dashboards.
          Serialized under the "_meta" key to distinguish it from domain data.
      course_id:
        description: CourseID is echoed from the request for client-side correlation.
        example: cs101
        type: string
      items:
        description: Items is the ordered sequence of study items, priority-sorted
          (1 = study first).
        items:
          $ref: '#/definitions/domain.PlanItem'
        type: array
      student_id:
        description: StudentID is echoed from the request for client-side correlation.
        example: student-42
        type: string
    type: object
  domain.Resource:
    properties:
      resource_type:
        description: |-
          ResourceType classifies the resource modality. Expected values per VARK:
            kinesthetic: "exercise", "lab", "coding-challenge"
            visual:      "video", "diagram", "infographic"
            auditory:    "podcast", "lecture", "audio-course"
            read_write:  "article", "textbook", "documentation"
        example: video
        type: string
      title:
        description: Title is a human-readable name for the resource.
        example: Polymorphism in Java – Visual Guide
        type: string
      url:
        description: URL is a fully-qualified link to the resource content.
        example: https://example.com/polymorphism-visual
        type: string
    type: object
  domain.Telemetry:
    properties:
      client_version:
        description: ClientVersion identifies the frontend application version for
          compatibility tracking.
        example: 2.4.1
        type: string
      duration_ms:
        description: DurationMs records how long the client spent on the assessment
          before requesting a plan.
        example: 12345.6
        type: number
      session_id:
        description: SessionID is a client-generated correlation identifier.
        example: sess-a1b2c3
        type: string
      timestamp_unix:
        description: TimestampUnix is the Unix epoch (seconds) at which the client
          created the request.
        example: 1713340800
        type: integer
    type: object
  domain.VisualEdge:
    properties:
      relation:
        description: Relation is the edge label (e.g., "depends_on", "is_a").
        example: depends_on
        type: string
      source:
        description: Source is the ID of the originating node (the dependent concept).
        example: Polymorphism
        type: string
      target:
        description: Target is the ID of the destination node (the prerequisite concept).
        example: Inheritance
        type: string
    type: object
  domain.VisualNode:
    properties:
      cognitive_state:
        description: |-
          CognitiveState indicates the student's cognitive state for this concept.
          Possible values:
            "failed"   -- the student explicitly failed this topic.
            "learning" -- this topic is a prerequisite of a failed topic.
            "mastered" -- no evidence of deficit; presumed mastered.
        example: failed
        type: string
      id:
        description: ID is the unique identifier for this node, equal to the knowledge-graph
          node name.
        example: Polymorphism
        type: string
      label:
        description: Label is the human-readable display text for the node.
        example: Polymorphism
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: AxiomLMS Engineering
  description: |-
    GraphRAG reasoning microservice. Generates adaptive study plans
    from student failed concepts using Amazon Nova Micro via BAML.
  title: AxiomEngine API
  version: "1.0"
paths:
  /api/v1/adaptive-plan:
    post:
      consumes:
      - application/json
      description: |-
        Accepts a student VARK profile and a list of failed concept IDs.
        Executes GraphRAG subgraph extraction, topological sort, and
        parallel BAML fan-out to Amazon Nova Micro. Returns a structured
        study plan ordered by prerequisite depth.
      parameters:
      - description: Student profile and failed concepts
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.AdaptivePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PlanResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Generate adaptive study plan
      tags:
      - Adaptive Plan
  /api/v1/tutor/student/{student_id}/cognitive-graph:
    get:
      description: |-
        Returns a filtered directed subgraph of curriculum concepts annotated
        with the student's cognitive state (failed, learning, mastered).
        When target_topic is provided, only the depth-1 neighborhood of that
        topic is returned. Otherwise, the depth-1 neighborhoods of all failed
        topics are merged. Only nodes with at least one edge are included.
        Output is directly consumable by Cytoscape.js and D3.js renderers.
      parameters:
      - description: Student identifier
        example: student-42
        in: path
        name: student_id
        required: true
        type: string
      - description: Comma-separated failed topic names
        example: Polymorphism,Recursion
        in: query
        name: topics
        required: true
        type: string
      - description: Single topic to center the subgraph on
        example: Recursion
        in: query
        name: target_topic
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CognitiveGraphResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Get cognitive shadow graph
      tags:
      - Tutor
  /health:
    get:
      description: Returns 200 if the service is running. Used by Railway and Docker
        health checks.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HealthResponse'
      summary: Health check
      tags:
      - System
schemes:
- http
- https
swagger: "2.0"
