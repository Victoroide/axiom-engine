            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "431":
          description: Request Header Fields Too Large
          headers:
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "503":
          description: Shared storage unavailable
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - InternalToken: []
      summary: List curriculum topics
      tags:
      - Curriculum
  /api/v1/topics/{topic}/path:
    get:
      operationId: getTopicPath
      parameters:
      - description: Topic name with canonical matching
        in: path
        name: topic
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
