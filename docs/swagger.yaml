basePath: /
definitions:
  domain.AdaptivePlanRequest:
    properties:
      course_id:
        description: CourseID identifies the course within which the adaptive plan
          is scoped.
        example: cs101
        type: string
      failed_topics:
        description: |-
          FailedTopics is a non-empty list of knowledge-graph node names
          representing concepts the student has not yet mastered.
        example:
        - Polymorphism
        - Recursion
        items:
          type: string
        type: array
      mastered_topics:
        description: MasteredTopics lists concepts already known by the learner.
        example:
        - Functions
        items:
          type: string
        type: array
      student_id:
        description: StudentID is the platform-level identifier for the learner.
        example: student-42
        type: string
      telemetry:
        allOf:
        - $ref: '#/definitions/domain.Telemetry'
        description: |-
          Telemetry carries optional client-side diagnostic metadata.
          When nil, telemetry is omitted from the serialized payload.
      vark_profile:
        description: |-
          VARKProfile specifies the student's dominant learning modality.
          Accepted values: "visual", "auditory", "read_write", "kinesthetic".
        example: visual
        type: string
    type: object
  domain.CognitiveGraphResponse:
    properties:
      edges:
        description: Edges contains directed relationships between nodes in the subgraph.
        items:
          $ref: '#/definitions/domain.VisualEdge'
        type: array
      nodes:
        description: |-
          Nodes contains the filtered concept nodes, each annotated
          with the student's cognitive state.
        items:
          $ref: '#/definitions/domain.VisualNode'
        type: array
    type: object
  domain.ErrorResponse:
    properties:
      details:
        description: |-
          Details provides a human-readable explanation of the error cause.
          Omitted when empty.
        example: failed_topics must contain at least one topic
        type: string
      error:
        description: |-
          Error is a machine-readable error code (e.g., "validation_error",
          "rate_limit_exceeded", "service_unavailable").
        example: validation_error
        type: string
    type: object
  domain.HealthResponse:
    properties:
      status:
        description: Status is always "ok" when the service is running.
        example: ok
        type: string
    type: object
  domain.PipelineMeta:
    properties:
      items_after_validation:
        description: |-
          ItemsValidated is the count of study items remaining after the
          graph validation stage retains requested topics and their prerequisites.
        example: 5
        type: integer
      items_dropped:
        description: ItemsDropped counts distinct items outside the requested prerequisite
          closure.
        example: 1
        type: integer
      items_generated:
        description: |-
          ItemsGenerated is the total number of study items returned across
          all per-topic LLM calls before deduplication.
        example: 6
        type: integer
      items_skipped_mastered:
        description: ItemsSkippedMastered counts distinct mastered prerequisites excluded
          from study.
        example: 2
        type: integer
      llm_latency_ms:
        description: |-
          LLMLatencyMs is the wall-clock time (milliseconds) spent waiting
          for all parallel LLM calls to complete.
        example: 3240
        type: integer
      resources_unreachable:
        description: ResourcesUnreachable counts sanitized resources removed by HTTP
          link checks.
        example: 1
        type: integer
      subgraph_tuples:
        description: |-
          SubgraphTuples is the number of knowledge-graph triples extracted
          by the BFS subgraph traversal for the given failed topics.
        example: 12
        type: integer
      topics_processed:
        description: |-
          TopicsProcessed is the count of failed topics that were individually
          sent to the LLM via the parallel fan-out stage.
        example: 2
        type: integer
      total_latency_ms:
        description: |-
          TotalLatencyMs is the end-to-end pipeline duration (milliseconds)
          from request receipt to response serialization.
        example: 3312
        type: integer
    type: object
  domain.PlanItem:
    properties:
      explanation:
        description: |-
          Explanation is a concise rationale generated by the LLM describing
          why this topic is relevant to the student's failed assessment. It contains
          at most 1000 runes, with Unicode control and format characters removed.
        example: Polymorphism allows objects to be treated as instances of their parent
          class.
        maxLength: 1000
        type: string
      prerequisite_chain:
        description: |-
          PrerequisiteChain lists the ordered prerequisite path leading to this
          topic, extracted from the knowledge graph via topological sort.
        example:
        - Variables
        - Objects
        - Classes
        - Inheritance
        items:
          type: string
        type: array
      priority:
        description: |-
          Priority determines the recommended study order. 1 = highest priority
          (study first). Included prerequisites precede their dependent topics.
        example: 1
        type: integer
      resources:
        description: |-
          Resources contains 0-3 learning resources whose type strictly matches
          the student's VARK profile.
        items:
          $ref: '#/definitions/domain.Resource'
        maxItems: 3
        type: array
      topic:
        description: Topic is the knowledge-graph node name this item targets.
        example: Polymorphism
        type: string
    type: object
  domain.PlanResponse:
    properties:
      _meta:
        allOf:
        - $ref: '#/definitions/domain.PipelineMeta'
        description: |-
          Meta exposes internal pipeline metrics for observability dashboards.
          Serialized under the "_meta" key to distinguish it from domain data.
      course_id:
        description: CourseID is echoed from the request for client-side correlation.
        example: cs101
        type: string
      items:
        description: Items is the ordered sequence of study items, priority-sorted
          (1 = study first).
        items:
          $ref: '#/definitions/domain.PlanItem'
        type: array
      student_id:
        description: StudentID is echoed from the request for client-side correlation.
        example: student-42
        type: string
    type: object
  domain.Resource:
    properties:
      resource_type:
        description: |-
          ResourceType is normalized to lowercase and restricted to these values per VARK:
            kinesthetic: "exercise", "lab", "coding-challenge"
            visual:      "video", "diagram", "infographic"
            auditory:    "podcast", "lecture", "audio-course"
            read_write:  "article", "textbook", "documentation"
        example: video
        type: string
      title:
        description: Title is a name of at most 200 runes, with Unicode control and
          format characters removed.
        example: Polymorphism in Java – Visual Guide
        maxLength: 200
        type: string
      url:
        description: URL is an absolute HTTP(S) link without userinfo, at most 2048
          characters.
        example: https://example.com/polymorphism-visual
        maxLength: 2048
        type: string
    type: object
  domain.Telemetry:
    properties:
      client_version:
        description: ClientVersion identifies the frontend application version for
          compatibility tracking.
        example: 2.4.1
        type: string
      duration_ms:
        description: DurationMs records how long the client spent on the assessment
          before requesting a plan.
        example: 12345.6
        type: number
      session_id:
        description: SessionID is a client-generated correlation identifier.
        example: sess-a1b2c3
        type: string
      timestamp_unix:
        description: TimestampUnix is the Unix epoch (seconds) at which the client
          created the request.
        example: 1713340800
        type: integer
    type: object
  domain.Topic:
    properties:
      dependents:
        example:
        - Dynamic Programming
        - Merge Sort
        items:
          type: string
        type: array
      name:
        example: Recursion
        type: string
      prerequisites:
        example:
        - Functions
        items:
          type: string
        type: array
    type: object
  domain.TopicPathResponse:
    properties:
      dependents:
        example:
        - Dynamic Programming
        - Merge Sort
        items:
          type: string
        type: array
      prerequisite_chain:
        example:
        - Functions
        items:
          type: string
        type: array
      topic:
        example: Recursion
        type: string
    type: object
  domain.TopicsResponse:
    properties:
      topics:
        items:
          $ref: '#/definitions/domain.Topic'
        type: array
    type: object
  domain.VisualEdge:
    properties:
      relation:
        description: Relation is the edge label (e.g., "depends_on", "is_a").
        example: depends_on
        type: string
      source:
        description: Source is the ID of the originating node (the dependent concept).
        example: Polymorphism
        type: string
      target:
        description: Target is the ID of the destination node (the prerequisite concept).
        example: Inheritance
        type: string
    type: object
  domain.VisualNode:
    properties:
      cognitive_state:
        description: |-
          CognitiveState indicates the student's cognitive state for this concept.
          Possible values:
            "failed"   -- the student explicitly failed this topic.
            "learning" -- this topic is a prerequisite of a failed topic.
            "mastered" -- no evidence of deficit; presumed mastered.
            "unassessed" -- no evidence when learner history is supplied.
        enum:
        - failed
        - learning
        - mastered
        - unassessed
        example: failed
        type: string
      id:
        description: ID is the unique identifier for this node, equal to the knowledge-graph
          node name.
        example: Polymorphism
        type: string
      label:
        description: Label is the human-readable display text for the node.
        example: Polymorphism
        type: string
    type: object
info:
  contact: {}
  description: Graph-guided adaptive study plans using a configurable provider.
  title: AxiomEngine API
  version: "1.0"
paths:
  /api/v1/adaptive-plan:
    post:
      consumes:
      - application/json
      description: Generate a graph-guided study plan for known topics and a VARK
        profile.
      operationId: generateAdaptivePlan
      parameters:
      - description: 1 to 255 visible ASCII characters; successful responses retained
          for 24h by default
        in: header
        name: Idempotency-Key
        type: string
      - description: Student profile and failed concepts
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.AdaptivePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          headers:
            Idempotent-Replayed:
              description: True when replaying a stored response
              type: boolean
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.PlanResponse'
        "400":
          description: Bad Request
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          headers:
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "408":
          description: Request not read within the 10 s read timeout
          headers:
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "409":
          description: idempotency_key_in_progress
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              type: integer
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "413":
          description: Request Entity Too Large
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "415":
          description: Unsupported Media Type
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "422":
          description: Unprocessable Entity
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "431":
          description: Request headers exceed the server limit
          headers:
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "502":
          description: Upstream failure or no usable item for a requested topic
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "503":
          description: Shared storage unavailable
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              type: integer
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "504":
          description: Gateway Timeout
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - InternalToken: []
      summary: Generate adaptive study plan
      tags:
      - Adaptive Plan
  /api/v1/adaptive-plan/stream:
    post:
      consumes:
      - application/json
      description: 'Emit topic events with topic, zero-based index of its first occurrence
        in failed_topics, and items_generated; plan carries the same validated response
        as the JSON route; error carries error, details and the equivalent HTTP status.
        Failed topic calls report zero items. Flush each event and a : keepalive comment
        every 2 seconds; cancel work after a failed client write. REQUEST_TIMEOUT
        bounds generation. Invalid input returns JSON before streaming starts. Optional
        mastered_topics uses the same validation and prerequisite exclusions as the
        JSON route.'
      operationId: streamAdaptivePlan
      parameters:
      - description: Student profile and failed concepts
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/domain.AdaptivePlanRequest'
      produces:
      - application/json
      - text/event-stream
      responses:
        "200":
          description: 'Server-sent events: topic, then plan or error'
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            type: string
        "400":
          description: Bad Request
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          headers:
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "408":
          description: Request Timeout
          headers:
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "413":
          description: Request Entity Too Large
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "415":
          description: Unsupported Media Type
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "422":
          description: Unprocessable Entity
          headers:
            X-RateLimit-Limit:
              description: Maximum requests per rate-limit window
              type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in the rate-limit window
              type: integer
            X-RateLimit-Reset:
              description: Seconds until the rate-limit window resets
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "429":
          description: Too Many Requests
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "431":
          description: Request Header Fields Too Large
          headers:
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          headers:
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "503":
          description: Shared storage unavailable or server shutdown
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              type: integer
            X-Request-ID:
              description: Resolved request correlation identifier
              type: string
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      security:
      - InternalToken: []
      summary: Stream adaptive study plan progress
      tags:
      - Adaptive Plan
      x-events:
        error:
          description: Usual error envelope plus equivalent HTTP status
          payload:
            details: upstream reasoning failed
            error: bad_gateway
            status: 502
        plan:
          schema:
            $ref: '#/definitions/domain.PlanResponse'
        topic:
          description: Completed topic call
          payload:
            index: 0
            items_generated: 1
            topic: Recursion
