run:
  timeout: 5m
  tests: true

issues:
  exclude-dirs:
    - baml_client
  exclude-files:
    - docs/docs.go
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - gosimple
    - typecheck

linters-settings:
  gofmt:
    simplify: true
  goimports:
    local-prefixes: axiom-reasoning-svc
  misspell:
    locale: US
  revive:
    severity: warning
    rules:
      - name: exported
      - name: package-comments
      - name: var-naming
      - name: error-return
      - name: error-naming
      - name: indent-error-flow
      - name: blank-imports
