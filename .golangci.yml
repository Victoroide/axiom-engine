version: "2"

run:
  timeout: 5m
  tests: true
  build-tags: [e2e]
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - govet
    - errcheck
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - noctx
    - gosec
    - revive
    - gocritic
    - misspell
    - errorlint
    - contextcheck
    - nilerr
    - prealloc
    - copyloopvar
    - usestdlibvars
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-return
        - name: error-naming
        - name: indent-error-flow
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets: []
    rules:
      - path: _test\.go$
        linters: [gosec]
        text: 'G404:'
    paths:
      - ^baml_client/
      - ^docs/docs\.go$

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Victoroide/axiom-engine
  exclusions:
    generated: lax
    paths:
      - ^baml_client/
      - ^docs/docs\.go$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
