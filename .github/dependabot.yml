version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      baml:
        patterns: ["github.com/boundaryml/baml"]
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)
  - package-ecosystem: gomod
    directory: /tools
    allow:
      # Tool providers are indirect in this tools-only Go module.
      - dependency-name: github.com/rhysd/actionlint
        dependency-type: all
      - dependency-name: github.com/swaggo/swag
        dependency-type: all
      - dependency-name: golang.org/x/tools
        dependency-type: all
      - dependency-name: golang.org/x/vuln
        dependency-type: all
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: ci(deps)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: build(deps)
