name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BAML_LIBRARY_PATH: ${{ github.workspace }}/bin/libbaml_cffi.so
  BAML_LIBRARY_DISABLE_DOWNLOAD: "true"
  BAML_LOG: "off"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make lint
  test:
    name: Test with race detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Prepare verified BAML native library
        run: make native-baml
      - run: make cover
      - name: Upload coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14
  generated:
    name: Check generated code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Prepare verified BAML native library
        run: make native-baml
      - run: make tools-baml generate-check tidy-check
  vulnerabilities:
    name: Check reachable vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make vuln
  image:
    name: Build service and runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make build
      - name: Build runtime image
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*version[[:space:]]*"\([^"]*\)".*/\1/p' baml_src/generators.baml)
          docker build --target runtime --build-arg BAML_VERSION="$version" -t axiom-ci .
      - name: Exercise runtime image
        run: make container-smoke container-smoke-test IMAGE=axiom-ci
  browser:
    name: Test API docs in browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Install or verify Chrome
        shell: bash
        run: |
          if ! command -v google-chrome >/dev/null; then
            curl --fail --silent --show-error --location \
              https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb \
              --output "$RUNNER_TEMP/google-chrome.deb"
            sudo apt-get update
            sudo apt-get install -y "$RUNNER_TEMP/google-chrome.deb"
          fi
          google-chrome --version
          echo "ROD_BROWSER_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Prepare verified BAML native library
        run: make native-baml
      - run: make test-e2e
