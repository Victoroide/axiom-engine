name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BAML_LIBRARY_PATH: ${{ github.workspace }}/bin/libbaml_cffi.so
  BAML_LIBRARY_DISABLE_DOWNLOAD: "true"
  BAML_LOG: "off"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Keep the golangci-lint analysis cache in one known directory
        run: echo "GOLANGCI_LINT_CACHE=$RUNNER_TEMP/golangci-lint" >> "$GITHUB_ENV"
      - name: Derive Go cache keys
        id: go-cache
        run: ./scripts/ci-go-cache.sh lint >> "$GITHUB_OUTPUT"
      - name: Restore Go module cache
        id: go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.modules-path }}
          key: ${{ steps.go-cache.outputs.modules-key }}
      - name: Restore Go build cache
        id: go-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.build-paths }}
          key: ${{ steps.go-cache.outputs.build-key }}
          restore-keys: ${{ steps.go-cache.outputs.build-restore-keys }}
      - run: make lint
      - run: make diagrams-check
      - name: Save Go module cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.modules-path }}
          key: ${{ steps.go-cache.outputs.modules-key }}
      - name: Save Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.build-paths }}
          key: ${{ steps.go-cache.outputs.build-key }}
  test:
    name: Test with race detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Derive Go cache keys
        id: go-cache
        run: ./scripts/ci-go-cache.sh test >> "$GITHUB_OUTPUT"
      - name: Restore Go module cache
        id: go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.modules-path }}
          key: ${{ steps.go-cache.outputs.modules-key }}
      - name: Restore Go build cache
        id: go-build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.build-paths }}
          key: ${{ steps.go-cache.outputs.build-key }}
          restore-keys: ${{ steps.go-cache.outputs.build-restore-keys }}
      - name: Prepare verified BAML native library
        run: make native-baml
      - run: make cover
      - name: Upload coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 14
      - name: Save Go build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.go-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.build-paths }}
          key: ${{ steps.go-cache.outputs.build-key }}
  generated:
    name: Check generated code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Derive Go cache keys
        id: go-cache
        run: ./scripts/ci-go-cache.sh modules >> "$GITHUB_OUTPUT"
      - name: Restore Go module cache
        id: go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.modules-path }}
          key: ${{ steps.go-cache.outputs.modules-key }}
      - name: Prepare verified BAML native library
        run: make native-baml
      - run: make tools-baml generate-check tidy-check toolchain-check
  vulnerabilities:
    name: Check reachable vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Derive Go cache keys
        id: go-cache
        run: ./scripts/ci-go-cache.sh modules >> "$GITHUB_OUTPUT"
      - name: Restore Go module cache
        id: go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.modules-path }}
          key: ${{ steps.go-cache.outputs.modules-key }}
      - run: make vuln
  image:
    name: Build service and runtime image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Derive Go cache keys
        id: go-cache
        run: ./scripts/ci-go-cache.sh modules >> "$GITHUB_OUTPUT"
      - name: Restore Go module cache
        id: go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.modules-path }}
          key: ${{ steps.go-cache.outputs.modules-key }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Read BAML version
        id: baml
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*version[[:space:]]*"\([^"]*\)".*/\1/p' baml_src/generators.baml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          build-args: BAML_VERSION=${{ steps.baml.outputs.version }}
          tags: axiom-ci
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=ci-runtime
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=ci-runtime' || '' }}
      - name: Exercise runtime image
        run: make container-smoke container-smoke-test IMAGE=axiom-ci
  browser:
    name: Test API docs in browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Derive Go cache keys
        id: go-cache
        run: ./scripts/ci-go-cache.sh modules >> "$GITHUB_OUTPUT"
      - name: Restore Go module cache
        id: go-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.go-cache.outputs.modules-path }}
          key: ${{ steps.go-cache.outputs.modules-key }}
      - name: Verify preinstalled Chrome
        shell: bash
        run: |
          if ! command -v google-chrome >/dev/null; then
            echo '::error::The runner must provide google-chrome for browser tests.' >&2
            exit 1
          fi
          google-chrome --version
          echo "ROD_BROWSER_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Prepare verified BAML native library
        run: make native-baml
      - run: make test-e2e
        env:
          E2E_ARTIFACTS_DIR: ${{ runner.temp }}/browser-artifacts
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure
          path: ${{ runner.temp }}/browser-artifacts
          if-no-files-found: warn
          retention-days: 14
