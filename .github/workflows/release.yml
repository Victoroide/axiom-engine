name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        required: true
        default: true

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/victoroide/axiom-engine
  BAML_LIBRARY_PATH: ${{ github.workspace }}/bin/libbaml_cffi.so
  BAML_LIBRARY_DISABLE_DOWNLOAD: "true"
  BAML_LOG: "off"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select release mode and verify tag ancestry
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          publish=false
          if [[ "$EVENT_NAME" == push || "$DRY_RUN" == false ]]; then
            if [[ "$RELEASE_REF" != refs/tags/v* ]]; then
              echo "Publishing requires a version tag" >&2
              exit 1
            fi
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "Tag commit $GITHUB_SHA is not on main" >&2
              exit 1
            }
            publish=true
          fi
          version=$(sed -n 's/^[[:space:]]*version[[:space:]]*"\([^"]*\)".*/\1/p' baml_src/generators.baml)
          test -n "$version"
          {
            echo "publish=$publish"
            echo "version=$version"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make lint test docker-build container-smoke IMAGE=axiom-release:verify

  dry-run:
    name: Dry-run runtime image (${{ matrix.arch }})
    needs: verify
    if: needs.verify.outputs.publish == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH/$(uname -m)" in
            amd64/x86_64|arm64/aarch64) ;;
            *) echo "Runner architecture does not match $ARCH" >&2; exit 1 ;;
          esac
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: axiom-release:${{ matrix.arch }}
          outputs: type=oci,dest=${{ runner.temp }}/runtime-${{ matrix.arch }}.tar
          build-args: |
            BAML_VERSION=${{ needs.verify.outputs.version }}
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ needs.verify.outputs.created }}
          provenance: mode=max
          sbom: true
      - name: Exercise native runtime image
        run: make container-smoke IMAGE=axiom-release:${{ matrix.arch }}

  build:
    name: Publish runtime image (${{ matrix.arch }})
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH/$(uname -m)" in
            amd64/x86_64|arm64/aarch64) ;;
            *) echo "Runner architecture does not match $ARCH" >&2; exit 1 ;;
          esac
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.9.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native runtime image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            BAML_VERSION=${{ needs.verify.outputs.version }}
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ needs.verify.outputs.created }}
          provenance: mode=max
          sbom: true
      - name: Exercise native runtime image
        run: make container-smoke IMAGE=${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified runtime image
        env:
          CANDIDATE: ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker push "$CANDIDATE"
          docker image inspect "$CANDIDATE" --format '{{range .RepoDigests}}{{println .}}{{end}}' |
            grep -Fx "$REGISTRY_IMAGE@$DIGEST"
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digest=${DIGEST#sha256:}
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/$digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge runtime image platforms
    needs: [verify, build]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Merge platform digests
        id: merge
        shell: bash
        env:
          METADATA_JSON: ${{ steps.metadata.outputs.json }}
        run: |
          mapfile -t image_tags < <(jq -r '.tags[]' <<< "$METADATA_JSON")
          test "${#image_tags[@]}" -gt 0
          tag_args=()
          for tag in "${image_tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          digest_files=("$RUNNER_TEMP/digests/"*)
          test "${#digest_files[@]}" -eq 2
          sources=()
          for file in "${digest_files[@]}"; do
            digest=$(basename "$file")
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$REGISTRY_IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          digest=$(docker buildx imagetools inspect "${image_tags[0]}" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  attest:
    name: Attest merged runtime image
    needs: [verify, merge]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest runtime image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ needs.merge.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  sign:
    name: Sign merged runtime image
    needs: [verify, merge, attest]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign runtime image
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: cosign sign --yes "$REGISTRY_IMAGE@$DIGEST"

  release:
    name: Create GitHub release
    needs: [verify, sign]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish generated release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes
