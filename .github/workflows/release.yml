name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and verify without publishing
        type: boolean
        required: true
        default: true
      native_inventory:
        description: Include and verify native library inventories
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY_IMAGE: ghcr.io/victoroide/axiom-engine
  BAML_LIBRARY_PATH: ${{ github.workspace }}/bin/libbaml_cffi.so
  BAML_LIBRARY_DISABLE_DOWNLOAD: "true"
  BAML_LOG: "off"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
      created: ${{ steps.release.outputs.created }}
      archive-version: ${{ steps.release.outputs.archive-version }}
      source-date-epoch: ${{ steps.release.outputs.source-date-epoch }}
      native-inventory: ${{ steps.release.outputs.native-inventory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select release mode and verify tag ancestry
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          DRY_RUN: ${{ inputs.dry_run }}
          NATIVE_INVENTORY_INPUT: ${{ inputs.native_inventory }}
          NATIVE_INVENTORY_ON_TAG: ${{ vars.RELEASE_NATIVE_INVENTORY }}
        run: |
          publish=false
          if [[ "$EVENT_NAME" == push || "$DRY_RUN" == false ]]; then
            if [[ "$RELEASE_REF" != refs/tags/v* ]]; then
              echo "Publishing requires a version tag" >&2
              exit 1
            fi
            git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
              echo "Tag commit $GITHUB_SHA is not on main" >&2
              exit 1
            }
            publish=true
          fi
          native_inventory=false
          if [[ "$EVENT_NAME" == push && "$NATIVE_INVENTORY_ON_TAG" == true ]] ||
             [[ "$EVENT_NAME" == workflow_dispatch && "$NATIVE_INVENTORY_INPUT" == true ]]; then
            native_inventory=true
          fi
          version=$(sed -n 's/^[[:space:]]*version[[:space:]]*"\([^"]*\)".*/\1/p' baml_src/generators.baml)
          test -n "$version"
          archive_version="dev-${GITHUB_SHA:0:12}"
          if [[ "$RELEASE_REF" == refs/tags/v* ]]; then
            archive_version=${RELEASE_REF#refs/tags/v}
          fi
          {
            echo "publish=$publish"
            echo "version=$version"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "archive-version=$archive_version"
            echo "source-date-epoch=$(git log -1 --format=%ct)"
            echo "native-inventory=$native_inventory"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - run: make lint test
      - name: Smoke the default runtime image before native builds
        if: steps.release.outputs.publish != 'false' || steps.release.outputs.native-inventory != 'false'
        run: make docker-build container-smoke

  archives:
    name: Build and verify archive (${{ matrix.os }}/${{ matrix.arch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15
            os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Verify native platform
        env:
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          test "$(go env GOHOSTOS)" = "$RELEASE_OS"
          test "$(go env GOHOSTARCH)" = "$RELEASE_ARCH"
      - name: Install GNU tar
        if: runner.os == 'macOS'
        run: brew install gnu-tar
      - name: Package and exercise native archive
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.archive-version }}
          SOURCE_DATE_EPOCH: ${{ needs.verify.outputs.source-date-epoch }}
          RELEASE_NATIVE_INVENTORY: ${{ needs.verify.outputs.native-inventory }}
        run: |
          archive_test=release-archive-runtime-test
          if [[ "$RELEASE_NATIVE_INVENTORY" == true ]]; then
            archive_test=release-archive-test
          fi
          make "$archive_test" release-archive release-archive-smoke \
            RELEASE_VERSION="$RELEASE_VERSION" RELEASE_DIR="$RUNNER_TEMP/archives" \
            SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archive-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/archives/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  checksums:
    name: Collect archive checksums
    needs: [verify, archives]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/archives
          pattern: release-archive-*
          merge-multiple: true
      - name: Hash every archive
        working-directory: ${{ runner.temp }}/archives
        shell: bash
        run: |
          archives=(*.tar.gz)
          test "${#archives[@]}" -eq 3
          sha256sum "${archives[@]}" | LC_ALL=C sort -k2 > checksums.txt
          sha256sum --check checksums.txt
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.verify.outputs.native-inventory == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: needs.verify.outputs.native-inventory == 'true'
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum
      - name: Verify inventories in the checksummed archives
        if: needs.verify.outputs.native-inventory == 'true'
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.archive-version }}
        run: |
          directory="$RUNNER_TEMP/archives"
          schema="$RUNNER_TEMP/cyclonedx"
          ./scripts/native-inventory-schema.sh "$schema"
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            name="axiom-engine_${RELEASE_VERSION}_${target/\//_}.tar.gz"
            digest=$(awk -v name="$name" '$2 == name { print $1 }' "$directory/checksums.txt")
            go -C tools run ./native-inventory -target "$target" -archive-sha256 "$digest" \
              -schema-dir "$schema" verify-archive "$directory/$name"
            echo "Verified native inventory for $target in $name ($digest)"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums
          path: ${{ runner.temp }}/archives/checksums.txt
          if-no-files-found: error
          retention-days: 1

  dry-run:
    name: Dry-run runtime image (${{ matrix.arch }})
    needs: verify
    if: needs.verify.outputs.publish == 'false'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH/$(uname -m)" in
            amd64/x86_64|arm64/aarch64) ;;
            *) echo "Runner architecture does not match $ARCH" >&2; exit 1 ;;
          esac
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.9.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the default amd64 runtime with Make
        if: matrix.arch == 'amd64' && needs.verify.outputs.native-inventory == 'false'
        env:
          VERSION: ${{ github.ref_name }}
          VCS_REF: ${{ github.sha }}
          BUILD_DATE: ${{ needs.verify.outputs.created }}
        run: make docker-build-release
      - name: Build without publishing
        if: matrix.arch != 'amd64' || needs.verify.outputs.native-inventory != 'false'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ needs.verify.outputs.native-inventory == 'true' && 'runtime-inventory' || 'runtime' }}
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: axiom-engine:local
          outputs: type=oci,dest=${{ runner.temp }}/runtime-${{ matrix.arch }}.tar
          build-args: |
            BAML_VERSION=${{ needs.verify.outputs.version }}
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ needs.verify.outputs.created }}
          provenance: mode=max
          sbom: true
      - name: Exercise native runtime image
        env:
          RELEASE_NATIVE_INVENTORY: ${{ needs.verify.outputs.native-inventory }}
        run: make container-smoke
      - name: Check the default image contents
        if: needs.verify.outputs.native-inventory == 'false'
        run: |
          container=$(docker create axiom-engine:local)
          trap 'docker rm "$container" >/dev/null' EXIT
          if docker cp "$container:/app/baml-native.cdx.json" "$RUNNER_TEMP" 2> "$RUNNER_TEMP/inventory-copy.log"; then
            echo 'The default image contains a native inventory' >&2
            exit 1
          fi
          grep -F 'Could not find the file /app/baml-native.cdx.json' "$RUNNER_TEMP/inventory-copy.log"
      - name: Verify native inventory in the exported OCI image
        if: needs.verify.outputs.native-inventory == 'true'
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          schema="$RUNNER_TEMP/cyclonedx"
          ./scripts/native-inventory-schema.sh "$schema"
          ./scripts/verify-release-image-inventory.sh axiom-engine:local "linux/$ARCH" "$DIGEST" \
            "$schema" "$RUNNER_TEMP/runtime-$ARCH.tar"

  build:
    name: Publish runtime image (${{ matrix.arch }})
    needs: verify
    if: needs.verify.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify native architecture
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH/$(uname -m)" in
            amd64/x86_64|arm64/aarch64) ;;
            *) echo "Runner architecture does not match $ARCH" >&2; exit 1 ;;
          esac
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          version: v29.9.2
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build native runtime image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: ${{ needs.verify.outputs.native-inventory == 'true' && 'runtime-inventory' || 'runtime' }}
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            BAML_VERSION=${{ needs.verify.outputs.version }}
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ needs.verify.outputs.created }}
          provenance: mode=max
          sbom: true
      - name: Exercise native runtime image
        env:
          RELEASE_NATIVE_INVENTORY: ${{ needs.verify.outputs.native-inventory }}
        run: make container-smoke IMAGE=${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push verified runtime image
        env:
          CANDIDATE: ${{ env.REGISTRY_IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker push "$CANDIDATE"
          docker image inspect "$CANDIDATE" --format '{{range .RepoDigests}}{{println .}}{{end}}' |
            grep -Fx "$REGISTRY_IMAGE@$DIGEST"
      - name: Verify native inventory from the registry by digest
        if: needs.verify.outputs.native-inventory == 'true'
        id: inventory
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          schema="$RUNNER_TEMP/cyclonedx"
          ./scripts/native-inventory-schema.sh "$schema"
          manifest=$(./scripts/verify-release-image-inventory.sh "$REGISTRY_IMAGE" "linux/$ARCH" "$DIGEST" "$schema")
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          MANIFEST: ${{ steps.inventory.outputs.manifest }}
        run: |
          digest=${DIGEST#sha256:}
          [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/$digest"
          if [[ -n "$MANIFEST" ]]; then
            printf 'linux/%s %s\n' "$ARCH" "$MANIFEST" > "$RUNNER_TEMP/digests/$digest"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge runtime image platforms
    needs: [verify, build, checksums]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Merge platform digests
        id: merge
        shell: bash
        env:
          METADATA_JSON: ${{ steps.metadata.outputs.json }}
          NATIVE_INVENTORY: ${{ needs.verify.outputs.native-inventory }}
        run: |
          tags=$(jq -er '.tags[]' <<< "$METADATA_JSON")
          image_tags=()
          tag_args=()
          while IFS= read -r tag; do
            image_tags+=("$tag")
            tag_args+=(--tag "$tag")
          done <<< "$tags"
          digest_files=("$RUNNER_TEMP/digests/"*)
          test "${#digest_files[@]}" -eq 2
          sources=()
          for file in "${digest_files[@]}"; do
            digest=$(basename "$file")
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            sources+=("$REGISTRY_IMAGE@sha256:$digest")
          done
          if [[ "$NATIVE_INVENTORY" == true ]]; then
            expected=$(LC_ALL=C sort "${digest_files[@]}")
            test "$(awk '{ print $1 }' <<< "$expected")" = $'linux/amd64\nlinux/arm64'
            staging="$REGISTRY_IMAGE:index-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            docker buildx imagetools create --tag "$staging" "${sources[@]}"
            digest=$(docker buildx imagetools inspect "$staging" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            candidate="$REGISTRY_IMAGE@$digest"
            index="$RUNNER_TEMP/merged-index.json"
            docker buildx imagetools inspect --raw "$candidate" > "$index"
            printf '%s  %s\n' "${digest#sha256:}" "$index" | sha256sum -c -
            actual=$(jq -er '.manifests[] | select(.platform.os == "linux") |
              "\(.platform.os)/\(.platform.architecture) \(.digest)"' "$index" | LC_ALL=C sort)
            test "$actual" = "$expected"
            docker buildx imagetools create "${tag_args[@]}" "$candidate"
            for tag in "${image_tags[@]}"; do
              test "$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}')" = "$digest"
            done
          else
            docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
            digest=$(docker buildx imagetools inspect "${image_tags[0]}" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  attest:
    name: Attest merged runtime image
    needs: [verify, merge]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest runtime image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY_IMAGE }}
          subject-digest: ${{ needs.merge.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  sign:
    name: Sign merged runtime image
    needs: [verify, merge, attest]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Sign runtime image
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: cosign sign --yes "$REGISTRY_IMAGE@$DIGEST"

  release:
    name: Create GitHub release
    needs: [verify, sign, checksums]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish generated release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes

  publish-archives:
    name: Sign checksums and attach archives
    needs: [verify, release, checksums]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/archives
          pattern: release-archive-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-checksums
          path: ${{ runner.temp }}/archives
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign archive checksums
        working-directory: ${{ runner.temp }}/archives
        run: |
          sha256sum --check checksums.txt
          cosign sign-blob --yes --bundle checksums.txt.sigstore.json checksums.txt
      - name: Attach verified archives and signature
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP"/archives/*.tar.gz \
            "$RUNNER_TEMP/archives/checksums.txt" "$RUNNER_TEMP/archives/checksums.txt.sigstore.json"

  provenance:
    name: Attach archive provenance
    needs: [verify, publish-archives]
    if: needs.verify.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-checksums
          path: ${{ runner.temp }}/provenance
      - name: Attest archive provenance
        id: attest-archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/provenance/checksums.txt
          create-storage-record: false
      - name: Attach provenance bundle and envelope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.verify.outputs.archive-version }}
          BUNDLE_PATH: ${{ steps.attest-archives.outputs.bundle-path }}
        run: |
          name="axiom-engine_$RELEASE_VERSION"
          bundle="$RUNNER_TEMP/provenance/$name.sigstore.json"
          envelope="$RUNNER_TEMP/provenance/$name.intoto.jsonl"
          cp "$BUNDLE_PATH" "$bundle"
          ./scripts/release-provenance.sh "$bundle" "$envelope"
          gh release upload "$RELEASE_TAG" "$bundle" "$envelope"
