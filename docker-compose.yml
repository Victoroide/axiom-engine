services:
  axiom-engine:
    build:
      context: .
      target: runtime
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      BAML_LOG: "${BAML_LOG:-off}"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/app/axiom-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
